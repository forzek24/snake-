<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Змейка 🐍</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ===== ФОНОВЫЙ CANVAS ===== */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            padding: 20px;
            position: relative;
        }

        /* ===== МЕНЮ ===== */
        #menu {
            text-align: center;
            background: rgba(15, 15, 30, 0.9);
            padding: 50px 60px;
            border-radius: 20px;
            border: 3px solid #4ade80;
            box-shadow: 0 0 60px rgba(74, 222, 128, 0.3);
            position: relative;
            z-index: 1;
        }
        #menu h1 { font-size: 52px; color: #4ade80; text-shadow: 0 0 20px #4ade80; margin-bottom: 10px; }
        #menu p { color: #9ca3af; margin-bottom: 30px; font-size: 16px; }
        .difficulty { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .diff-btn {
            padding: 15px 40px; font-size: 20px; font-family: 'Courier New', monospace;
            font-weight: bold; border: none; border-radius: 10px; cursor: pointer;
            transition: all 0.2s; color: #1a1a2e;
        }
        .diff-btn:hover { transform: scale(1.05); box-shadow: 0 0 20px currentColor; }
        .diff-btn.easy { background: #4ade80; }
        .diff-btn.normal { background: #fbbf24; }
        .diff-btn.hard { background: #f97316; }
        .diff-btn.impossible { background: #ef4444; color: white; }

        /* ===== ИГРА ===== */
        #game-screen { display: none; flex-direction: column; align-items: center; position: relative; z-index: 1; }
        #top-bar {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; max-width: 500px; margin-bottom: 10px; gap: 10px;
        }
        #score { font-size: 24px; color: #fbbf24; font-weight: bold; }
        #level-info { font-size: 14px; color: #9ca3af; }
        #back-btn {
            background: rgba(239, 68, 68, 0.2); color: #ef4444;
            border: 2px solid #ef4444; padding: 8px 14px; border-radius: 8px;
            cursor: pointer; font-family: 'Courier New', monospace;
            font-weight: bold; transition: all 0.2s; font-size: 12px;
        }
        #back-btn:hover { background: #ef4444; color: white; }

        #event-status {
            font-size: 14px; color: #a78bfa; margin-bottom: 10px;
            font-weight: bold; letter-spacing: 1px;
        }
        #event-status.warning { color: #fbbf24; animation: blink 0.5s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        canvas#game {
            background: #0f0f1e; border: 3px solid #4ade80; border-radius: 12px;
            box-shadow: 0 0 40px rgba(74, 222, 128, 0.5);
        }

        /* ===== УВЕДОМЛЕНИЕ О СОБЫТИИ ===== */
        #event-notification {
            position: fixed; top: 30px; left: 50%; transform: translateX(-50%);
            padding: 18px 40px; border-radius: 12px;
            font-size: 22px; font-weight: bold; font-family: 'Courier New', monospace;
            z-index: 50; display: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        #event-notification.show {
            display: block;
            animation: popIn 0.4s ease-out;
        }
        @keyframes popIn {
            0% { transform: translateX(-50%) scale(0.5); opacity: 0; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }
        #event-notification.x4apples { background: #22c55e; color: white; }
        #event-notification.slow { background: #3b82f6; color: white; }
        #event-notification.fast { background: #f97316; color: white; }
        #event-notification.shrink { background: #ef4444; color: white; }

        /* ===== КНОПКИ WASD ===== */
        #controls {
            margin-top: 25px; display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(2, 70px); gap: 10px;
        }
        .control-btn {
            background: linear-gradient(135deg, #2d2d44, #1a1a2e);
            color: #4ade80; border: 2px solid #4ade80; border-radius: 12px;
            font-size: 26px; font-weight: bold; font-family: 'Courier New', monospace;
            cursor: pointer; transition: all 0.15s;
            box-shadow: 0 4px 0 rgba(74, 222, 128, 0.3);
        }
        .control-btn:active, .control-btn.pressed {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(74, 222, 128, 0.3);
            background: #4ade80; color: #1a1a2e;
        }
        #btn-w { grid-column: 2; grid-row: 1; }
        #btn-a { grid-column: 1; grid-row: 2; }
        #btn-s { grid-column: 2; grid-row: 2; }
        #btn-d { grid-column: 3; grid-row: 2; }

        /* ===== GAME OVER ===== */
        #gameover {
            display: none; position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(26, 26, 46, 0.97); padding: 40px 60px;
            border-radius: 20px; border: 3px solid #ef4444; text-align: center;
            box-shadow: 0 0 60px rgba(239, 68, 68, 0.5); z-index: 100;
        }
        #gameover h2 { color: #ef4444; font-size: 36px; margin-bottom: 15px; }
        #gameover p { font-size: 20px; margin-bottom: 10px; }
        #gameover .final { color: #fbbf24; font-size: 32px; font-weight: bold; margin: 20px 0; }
        #gameover button {
            background: #4ade80; color: #1a1a2e; border: none;
            padding: 12px 30px; font-size: 18px; border-radius: 8px;
            cursor: pointer; font-family: 'Courier New', monospace;
            font-weight: bold; transition: transform 0.2s; margin: 5px;
        }
        #gameover button:hover { transform: scale(1.05); }
        #gameover button.menu-btn { background: #6b7280; color: white; }
    </style>
</head>
<body>

    <!-- ФОНОВЫЕ ЗМЕЙКИ -->
    <canvas id="bg-canvas"></canvas>

    <!-- МЕНЮ -->
    <div id="menu">
        <h1>🐍 ЗМЕЙКА</h1>
        <p>Выбери сложность:</p>
        <div class="difficulty">
            <button class="diff-btn easy" onclick="startGame('easy')">🟢 ЛЕГКО</button>
            <button class="diff-btn normal" onclick="startGame('normal')">🟡 НОРМАЛЬНО</button>
            <button class="diff-btn hard" onclick="startGame('hard')">🟠 СЛОЖНО</button>
            <button class="diff-btn impossible" onclick="startGame('impossible')">🔴 НЕВОЗМОЖНО</button>
        </div>
        <p style="font-size: 13px; margin-top: 20px;">
            🎲 Каждые 30 сек — событие!<br>
            🍎 Каждое яблоко = -2 сек до события!
        </p>
    </div>

    <!-- ИГРА -->
    <div id="game-screen">
        <div id="top-bar">
            <button id="back-btn" onclick="backToMenu()">← МЕНЮ</button>
            <div id="score">Счёт: 0</div>
            <div id="level-info">🐢 Легко</div>
        </div>
        <div id="event-status">🎲 Событие через: 30с</div>

        <canvas id="game" width="400" height="400"></canvas>

        <div id="controls">
            <button class="control-btn" id="btn-w" onclick="setDir('up')">W</button>
            <button class="control-btn" id="btn-a" onclick="setDir('left')">A</button>
            <button class="control-btn" id="btn-s" onclick="setDir('down')">S</button>
            <button class="control-btn" id="btn-d" onclick="setDir('right')">D</button>
        </div>
    </div>

    <!-- УВЕДОМЛЕНИЕ -->
    <div id="event-notification"></div>

    <!-- GAME OVER -->
    <div id="gameover">
        <h2>💀 ИГРА ОКОНЧЕНА</h2>
        <p>Твой счёт:</p>
        <div class="final" id="finalScore">0</div>
        <button onclick="restart()">🔄 Играть снова</button>
        <button class="menu-btn" onclick="backToMenu()">🏠 В меню</button>
    </div>

    <script>
        // ========================================
        // === ОСНОВНАЯ ИГРА ======================
        // ========================================
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const gameoverEl = document.getElementById('gameover');
        const finalScoreEl = document.getElementById('finalScore');
        const menuEl = document.getElementById('menu');
        const gameScreenEl = document.getElementById('game-screen');
        const levelInfoEl = document.getElementById('level-info');
        const eventStatusEl = document.getElementById('event-status');
        const notificationEl = document.getElementById('event-notification');

        const CELL = 20;
        const COLS = canvas.width / CELL;
        const ROWS = canvas.height / CELL;

        const DIFFICULTY = {
            easy:       { speed: 180, label: '🐢 Легко',      color: '#4ade80' },
            normal:     { speed: 130, label: '🚶 Нормально',  color: '#fbbf24' },
            hard:       { speed: 85,  label: '🏃 Сложно',     color: '#f97316' },
            impossible: { speed: 55,  label: '💀 Невозможно', color: '#ef4444' }
        };

        let snake, foods, direction, nextDirection, score, gameOver;
        let baseSpeed, speedMult, gameLoop;
        let currentDifficulty = 'normal';

        let activeEvent = null;
        let eventTimeout = null;
        let countdownTimer = null;
        let nextEventIn = 30;
        let fieldShrink = false;
        const EVENT_DURATION = 10000;
        const EVENT_INTERVAL = 30;

        function init() {
            snake = [{x: 10, y: 10}];
            direction = {x: 1, y: 0};
            nextDirection = {x: 1, y: 0};
            score = 0;
            baseSpeed = DIFFICULTY[currentDifficulty].speed;
            speedMult = 1;
            gameOver = false;
            fieldShrink = false;
            activeEvent = null;
            foods = [];
            spawnFood();
            scoreEl.textContent = 'Счёт: 0';
            levelInfoEl.textContent = DIFFICULTY[currentDifficulty].label;
            gameoverEl.style.display = 'none';
            hideNotification();
        }

        function getBounds() {
            if (fieldShrink) {
                return { minX: 5, maxX: 15, minY: 5, maxY: 15 };
            }
            return { minX: 0, maxX: COLS, minY: 0, maxY: ROWS };
        }

        function spawnFood() {
            const b = getBounds();
            let newFood;
            let attempts = 0;
            do {
                newFood = {
                    x: Math.floor(Math.random() * (b.maxX - b.minX)) + b.minX,
                    y: Math.floor(Math.random() * (b.maxY - b.minY)) + b.minY
                };
                attempts++;
                if (attempts > 200) break;
            } while (
                snake.some(s => s.x === newFood.x && s.y === newFood.y) ||
                foods.some(f => f.x === newFood.x && f.y === newFood.y)
            );
            foods.push(newFood);
        }

        function draw() {
            ctx.fillStyle = '#0f0f1e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(74, 222, 128, 0.05)';
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
            }
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
            }

            if (fieldShrink) {
                const b = getBounds();
                ctx.fillStyle = 'rgba(239, 68, 68, 0.25)';
                ctx.fillRect(0, 0, canvas.width, b.minY * CELL);
                ctx.fillRect(0, b.maxY * CELL, canvas.width, canvas.height - b.maxY * CELL);
                ctx.fillRect(0, b.minY * CELL, b.minX * CELL, (b.maxY - b.minY) * CELL);
                ctx.fillRect(b.maxX * CELL, b.minY * CELL, canvas.width - b.maxX * CELL, (b.maxY - b.minY) * CELL);

                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 3;
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 15;
                ctx.strokeRect(
                    b.minX * CELL, b.minY * CELL,
                    (b.maxX - b.minX) * CELL, (b.maxY - b.minY) * CELL
                );
                ctx.shadowBlur = 0;
                ctx.lineWidth = 1;
            }

            foods.forEach(f => {
                ctx.fillStyle = '#ef4444';
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 15;
                ctx.beginPath();
                ctx.arc(f.x * CELL + CELL/2, f.y * CELL + CELL/2, CELL/2 - 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            snake.forEach((seg, i) => {
                if (i === 0) {
                    ctx.fillStyle = '#4ade80';
                    ctx.shadowColor = '#4ade80';
                    ctx.shadowBlur = 15;
                } else {
                    const t = i / snake.length;
                    ctx.fillStyle = `rgb(${Math.floor(74 + t*100)}, ${Math.floor(222 - t*100)}, ${Math.floor(128 - t*50)})`;
                    ctx.shadowBlur = 0;
                }
                ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
            });
            ctx.shadowBlur = 0;

            const head = snake[0];
            ctx.fillStyle = '#0f0f1e';
            const eyeSize = 3;
            const cx = head.x * CELL + CELL/2;
            const cy = head.y * CELL + CELL/2;
            if (direction.x === 1) {
                ctx.fillRect(cx + 2, cy - 5, eyeSize, eyeSize); ctx.fillRect(cx + 2, cy + 2, eyeSize, eyeSize);
            } else if (direction.x === -1) {
                ctx.fillRect(cx - 5, cy - 5, eyeSize, eyeSize); ctx.fillRect(cx - 5, cy + 2, eyeSize, eyeSize);
            } else if (direction.y === -1) {
                ctx.fillRect(cx - 5, cy - 5, eyeSize, eyeSize); ctx.fillRect(cx + 2, cy - 5, eyeSize, eyeSize);
            } else {
                ctx.fillRect(cx - 5, cy + 2, eyeSize, eyeSize); ctx.fillRect(cx + 2, cy + 2, eyeSize, eyeSize);
            }
        }

        function update() {
            if (gameOver) return;

            direction = nextDirection;
            const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};
            const b = getBounds();

            if (head.x < b.minX || head.x >= b.maxX || head.y < b.minY || head.y >= b.maxY) {
                endGame();
                return;
            }

            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            const foodIndex = foods.findIndex(f => f.x === head.x && f.y === head.y);
            if (foodIndex !== -1) {
                score += 10;
                scoreEl.textContent = 'Счёт: ' + score;
                foods.splice(foodIndex, 1);
                if (foods.length === 0) spawnFood();
                if (score % 50 === 0 && baseSpeed > 40) {
                    baseSpeed -= 8;
                    restartLoop();
                }

                // 🍎 Каждое яблоко ускоряет событие на 2 секунды
                if (!activeEvent) {
                    nextEventIn = Math.max(0, nextEventIn - 2);
                    updateEventStatus();
                    if (nextEventIn === 0) {
                        triggerEvent();
                        nextEventIn = EVENT_INTERVAL;
                    }
                }
            } else {
                snake.pop();
            }
        }

        function endGame() {
            gameOver = true;
            finalScoreEl.textContent = score;
            gameoverEl.style.display = 'block';
            stopEventSystem();
        }

        function loop() {
            update();
            draw();
        }

        function restartLoop() {
            if (!gameLoop) return;
            clearInterval(gameLoop);
            const interval = baseSpeed * speedMult;
            gameLoop = setInterval(loop, interval);
        }

        function setDir(dir) {
            if (dir === 'up' && direction.y !== 1) nextDirection = {x: 0, y: -1};
            else if (dir === 'down' && direction.y !== -1) nextDirection = {x: 0, y: 1};
            else if (dir === 'left' && direction.x !== 1) nextDirection = {x: -1, y: 0};
            else if (dir === 'right' && direction.x !== -1) nextDirection = {x: 1, y: 0};
        }

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            let dir = null;
            if (key === 'arrowup' || key === 'w' || key === 'ц') dir = 'up';
            else if (key === 'arrowdown' || key === 's' || key === 'ы') dir = 'down';
            else if (key === 'arrowleft' || key === 'a' || key === 'ф') dir = 'left';
            else if (key === 'arrowright' || key === 'd' || key === 'в') dir = 'right';
            
            if (dir) setDir(dir);
            if (key.startsWith('arrow')) e.preventDefault();

            const btnMap = { up: 'btn-w', down: 'btn-s', left: 'btn-a', right: 'btn-d' };
            if (dir) {
                const btn = document.getElementById(btnMap[dir]);
                btn.classList.add('pressed');
                setTimeout(() => btn.classList.remove('pressed'), 100);
            }
        });

        function startEventSystem() {
            stopEventSystem();
            nextEventIn = EVENT_INTERVAL;
            updateEventStatus();
            
            countdownTimer = setInterval(() => {
                nextEventIn--;
                updateEventStatus();
                if (nextEventIn <= 0 && !activeEvent) {
                    triggerEvent();
                    nextEventIn = EVENT_INTERVAL;
                }
            }, 1000);
        }

        function stopEventSystem() {
            clearInterval(countdownTimer);
            clearTimeout(eventTimeout);
            countdownTimer = null;
            eventTimeout = null;
            clearActiveEvent();
        }

        function updateEventStatus() {
            if (activeEvent) return;
            eventStatusEl.textContent = `🎲 Событие через: ${nextEventIn}с`;
            if (nextEventIn <= 5) eventStatusEl.classList.add('warning');
            else eventStatusEl.classList.remove('warning');
        }

        function triggerEvent() {
            clearActiveEvent();
            
            const events = ['x4apples', 'slow', 'fast', 'shrink'];
            const ev = events[Math.floor(Math.random() * events.length)];
            activeEvent = ev;

            switch(ev) {
                case 'x4apples':
                    for (let i = 0; i < 3; i++) spawnFood();
                    showNotification('🍎 x4 ЯБЛОКИ!', 'x4apples');
                    break;
                case 'slow':
                    speedMult = 2;
                    restartLoop();
                    showNotification('🐌 МЕДЛЕННОСТЬ x2', 'slow');
                    break;
                case 'fast':
                    speedMult = 0.5;
                    restartLoop();
                    showNotification('⚡ СКОРОСТЬ x2', 'fast');
                    break;
                case 'shrink':
                    fieldShrink = true;
                    const b = getBounds();
                    snake = snake.map(s => ({
                        x: Math.max(b.minX, Math.min(b.maxX - 1, s.x)),
                        y: Math.max(b.minY, Math.min(b.maxY - 1, s.y))
                    }));
                    foods = foods.filter(f => 
                        f.x >= b.minX && f.x < b.maxX && f.y >= b.minY && f.y < b.maxY
                    );
                    if (foods.length === 0) spawnFood();
                    showNotification('⚠ ТЕРРИТОРИЯ МЕНЬШЕ!', 'shrink');
                    break;
            }

            eventStatusEl.textContent = `⚡ СОБЫТИЕ АКТИВНО!`;
            eventStatusEl.classList.add('warning');

            eventTimeout = setTimeout(clearActiveEvent, EVENT_DURATION);
        }

        function clearActiveEvent() {
            if (!activeEvent) return;

            if (activeEvent === 'x4apples') {
                while (foods.length > 1) foods.pop();
                if (foods.length === 0) spawnFood();
            }
            speedMult = 1;
            fieldShrink = false;
            activeEvent = null;
            restartLoop();
            hideNotification();
            updateEventStatus();
        }

        function showNotification(text, type) {
            notificationEl.textContent = text;
            notificationEl.className = 'show ' + type;
        }

        function hideNotification() {
            notificationEl.className = '';
            notificationEl.style.display = 'none';
            void notificationEl.offsetWidth;
            notificationEl.style.display = '';
        }

        function startGame(difficulty) {
            currentDifficulty = difficulty;
            menuEl.style.display = 'none';
            gameScreenEl.style.display = 'flex';
            init();
            clearInterval(gameLoop);
            gameLoop = setInterval(loop, baseSpeed * speedMult);
            startEventSystem();
        }

        function backToMenu() {
            clearInterval(gameLoop);
            gameLoop = null;
            stopEventSystem();
            gameScreenEl.style.display = 'none';
            gameoverEl.style.display = 'none';
            menuEl.style.display = 'block';
        }

        function restart() {
            gameoverEl.style.display = 'none';
            init();
            clearInterval(gameLoop);
            gameLoop = setInterval(loop, baseSpeed * speedMult);
            startEventSystem();
        }

        // ========================================
        // === ФОНОВЫЕ ЗМЕЙКИ ДЛЯ МЕНЮ ============
        // ========================================
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');

        function resizeBg() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
        }
        resizeBg();
        window.addEventListener('resize', () => {
            resizeBg();
            initBgSnakes();
        });

        const BG_CELL = 25;
        const BG_COUNT = 7;

        const BG_COLORS = [
            { head: '#4ade80', body: [74, 222, 128] },
            { head: '#60a5fa', body: [96, 165, 250] },
            { head: '#fbbf24', body: [251, 191, 36] },
            { head: '#f472b6', body: [244, 114, 182] },
            { head: '#a78bfa', body: [167, 139, 250] },
            { head: '#22d3ee', body: [34, 211, 238] },
            { head: '#ef4444', body: [239, 68, 68] }
        ];

        let bgSnakes = [];

        function createBgSnake() {
            const cols = Math.floor(bgCanvas.width / BG_CELL);
            const rows = Math.floor(bgCanvas.height / BG_CELL);

            const x = Math.floor(Math.random() * cols);
            const y = Math.floor(Math.random() * rows);

            const dirs = [
                {x: 1, y: 0}, {x: -1, y: 0},
                {x: 0, y: 1}, {x: 0, y: -1}
            ];
            const dir = dirs[Math.floor(Math.random() * dirs.length)];
            const color = BG_COLORS[Math.floor(Math.random() * BG_COLORS.length)];
            const length = 3 + Math.floor(Math.random() * 5);

            const body = [];
            for (let i = 0; i < length; i++) {
                body.push({ x: x - dir.x * i, y: y - dir.y * i });
            }

            return {
                body,
                dir,
                nextDir: dir,
                color,
                turnCooldown: Math.floor(Math.random() * 10)
            };
        }

        function initBgSnakes() {
            bgSnakes = [];
            for (let i = 0; i < BG_COUNT; i++) {
                bgSnakes.push(createBgSnake());
            }
        }

        function updateBgSnake(snake) {
            const cols = Math.floor(bgCanvas.width / BG_CELL);
            const rows = Math.floor(bgCanvas.height / BG_CELL);

            if (snake.turnCooldown <= 0 && Math.random() < 0.2) {
                const possible = [
                    {x: 1, y: 0}, {x: -1, y: 0},
                    {x: 0, y: 1}, {x: 0, y: -1}
                ].filter(d => !(d.x === -snake.dir.x && d.y === -snake.dir.y));
                snake.nextDir = possible[Math.floor(Math.random() * possible.length)];
                snake.turnCooldown = 3;
            }
            snake.turnCooldown--;
            snake.dir = snake.nextDir;

            const head = snake.body[0];
            const newHead = { x: head.x + snake.dir.x, y: head.y + snake.dir.y };

            if (newHead.x < 0 || newHead.x >= cols || newHead.y < 0 || newHead.y >= rows) {
                return false;
            }

            if (snake.body.some(s => s.x === newHead.x && s.y === newHead.y)) {
                return false;
            }

            snake.body.unshift(newHead);
            snake.body.pop();
            return true;
        }

        function drawBgSnake(snake) {
            snake.body.forEach((seg, i) => {
                const alpha = 1 - (i / snake.body.length) * 0.6;

                if (i === 0) {
                    bgCtx.fillStyle = snake.color.head;
                    bgCtx.globalAlpha = 0.35;
                    bgCtx.shadowColor = snake.color.head;
                    bgCtx.shadowBlur = 10;
                } else {
                    const c = snake.color.body;
                    bgCtx.fillStyle = `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
                    bgCtx.globalAlpha = 0.2 * alpha;
                    bgCtx.shadowBlur = 0;
                }
                bgCtx.fillRect(
                    seg.x * BG_CELL + 2,
                    seg.y * BG_CELL + 2,
                    BG_CELL - 4,
                    BG_CELL - 4
                );
            });
            bgCtx.globalAlpha = 1;
            bgCtx.shadowBlur = 0;
        }

        function bgLoop() {
            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);

            bgSnakes.forEach((snake, i) => {
                if (!updateBgSnake(snake)) {
                    bgSnakes[i] = createBgSnake();
                    return;
                }
                drawBgSnake(snake);
            });

            setTimeout(bgLoop, 150);
        }

        initBgSnakes();
        bgLoop();
    </script>
